<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm đường ngắn nhất</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 8px;
            font-style: italic;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .alert {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        .icon {
            font-size: 1.3em;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Tìm đường ngắn nhất</h1>
        
        <form method="POST">
            <div class="form-group">
                <h3><span class="icon">📍</span>Điểm đầu:</h3>
                <input type="text" name="start_place" placeholder="VD: Chợ Hà Đông hoặc 20.970, 105.770" required>
                <div class="hint">Nhập địa chỉ hoặc tọa độ (lat, lon)</div>
            </div>
            
            <div class="form-group">
                <h3><span class="icon">🏁</span>Điểm cuối:</h3>
                <input type="text" name="end_place" placeholder="VD: BYT Hà Đông hoặc 20.950, 105.780" required>
                <div class="hint">Nhập địa chỉ hoặc tọa độ (lat, lon)</div>
            </div>
            
            <button type="submit">🚀 Tìm đường</button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">⚠️ {{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
